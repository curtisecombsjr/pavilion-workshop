# demo_perms: permutations, now submitted as PBS jobs (one job per instance).
matrix:
  summary: 'One config expands into many PBS tests via permutations'
  scheduler: pbs
  schedule: {pbs: {queue: workq, nodes: 1, walltime: '00:02:00'}}
  permute_on: [size, mode]
  variables:
    size: ['small', 'medium', 'large']
    mode: ['read', 'write']
  subtitle: '{{size}}-{{mode}}'
  run:
    cmds: ['echo "size={{size}} mode={{mode}} host=$(hostname)"']
