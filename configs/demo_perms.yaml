# demo_perms: permutations submitted as SEPARATE PBS jobs (one job per instance).
# share_allocation: false tells Pavilion not to pack the permutations into one
# allocation — each test kicks off its own PBS job.
matrix:
  summary: 'One config expands into many PBS tests via permutations'
  scheduler: pbs
  schedule:
    share_allocation: false
    pbs: {queue: workq, nodes: 1, walltime: '00:02:00'}
  permute_on: [size, mode]
  variables:
    size: ['small', 'medium', 'large']
    mode: ['read', 'write']
  subtitle: '{{size}}-{{mode}}'
  run:
    cmds: ['echo "size={{size}} mode={{mode}} host=$(hostname)"']
