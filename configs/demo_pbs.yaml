# demo_pbs: PBS-scheduled basics. Every run is a real PBS job (qstat -a shows it).
pass:
  summary: 'Trivial PASS via PBS'
  scheduler: pbs
  schedule:
    pbs:
      queue: workq
      nodes: 1
      walltime: '00:02:00'
  run:
    cmds:
      - 'echo "hello from $(hostname)"'
fail:
  summary: 'Intentional FAIL via PBS'
  scheduler: pbs
  schedule:
    pbs:
      queue: workq
      nodes: 1
      walltime: '00:02:00'
  run:
    cmds:
      - 'echo "this fails on purpose"'
      - 'exit 7'
metrics:
  summary: 'PASS with parsed metrics via PBS'
  scheduler: pbs
  schedule:
    pbs:
      queue: workq
      nodes: 1
      walltime: '00:02:00'
  run:
    cmds:
      - 'echo "throughput 123.45"'
      - 'echo "latency 5.6"'
      - 'echo "errors 0"'
  result_parse:
    regex:
      throughput_mbs:
        regex: 'throughput (\S+)'
      latency_ms:
        regex: 'latency (\S+)'
      errors:
        regex: 'errors (\S+)'
salog:
  summary: 'saLog demo — writes a per-node .log so the sa_log logger fires on release'
  scheduler: pbs
  schedule:
    pbs:
      queue: workq
      nodes: 1
      walltime: '00:02:00'
  run:
    cmds:
      - 'exec > "$(hostname).log" 2>&1'
      - 'echo "saLog demo passed"'
  result_parse:
    regex:
      passed:
        regex: 'saLog demo passed'
        action: store_true
        files: ['*.log']
        per_file: name
  result_evaluate:
    result: 'all(per_file.*.passed)'
