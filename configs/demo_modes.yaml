# demo_modes: the test FAILs on its own; a mode overrides a value to make it PASS.
# Base throughput is 1200, and the test requires > 1300 -> FAIL.
# Run with `-m prod` to bump throughput to 1400 -> PASS.
mode_demo:
  summary: 'A mode overrides a measured value, flipping the test FAIL -> PASS (PBS)'
  scheduler: pbs
  schedule:
    pbs:
      queue: workq
      nodes: 1
      walltime: '00:02:00'
  variables:
    throughput: 1200
  run:
    cmds:
      - 'echo "throughput {{throughput}}"'
  result_parse:
    regex:
      throughput_mbs:
        regex: 'throughput (\S+)'
  result_evaluate:
    result: 'throughput_mbs > 1300'
